[config]
schemaVerison = "0.0.1"

[general]
repository = "https://thunderstore.io"

[package]
namespace = "MeowTools21"
name = "MeowTools21"
description = "一站式 QoL 整合包：中文属性面板 + 宝箱高亮 + 小地图，依赖自动装齐。基于 LookingGlass 修改。"
websiteUrl = "https://github.com/ryougi21-9527/PanelDisplay21"
containsNsfwContent = false

[package.dependencies]
bbepis-BepInExPack = "5.4.2122"
Rune580-Risk_Of_Options = "2.8.6"
RiskofThunder-HookGenPatcher = "1.2.9"
Faustvii-QoLChests = "1.3.6"
DekuDesu-MiniMapMod = "4.0.0"

[build]
icon = "icons/meowtools21-icon.png"
readme = "readme-meowtools21.md"
outdir = "../../出包文件夹"

[[build.copy]]
source = "../LookingGlass/bin/Release/netstandard2.1/PanelDisplay21.dll"
target = "plugins/PanelDisplay21/"

[[build.copy]]
source = "CHANGELOG.md"
target = "/"

[[build.copy]]
source = "../LICENSE"
target = "/"

[[build.copy]]
source = "./icons/meowtools21-icon.png"
target = "plugins/PanelDisplay21/icons/"

[publish]
communities = [ "riskofrain2" ]

[publish.categories]
riskofrain2 = [ "modpacks" ]
